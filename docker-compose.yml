services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: lane, POSTGRES_PASSWORD: lane, POSTGRES_DB: lane}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lane"], interval: 5s, retries: 10}
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lane:lane@db:5432/lane
      LANE_INLINE_WORKER: "false"
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql://lane:lane@db:5432/lane", LANE_SEED_ON_START: "false"}
    command: ["python", "-m", "app.worker"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
